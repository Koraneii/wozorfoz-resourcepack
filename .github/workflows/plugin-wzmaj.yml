name: Compiler le plugin WzMaj

on:
  push:
    branches: [main]
    paths: ["plugin-wzmaj/**", ".github/workflows/plugin-wzmaj.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Compilation
        working-directory: plugin-wzmaj
        run: chmod +x gradlew && ./gradlew build --no-daemon
      - name: Publier le plugin
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-wzmaj
          name: Plugin WzMaj (mises à jour sans redémarrage)
          make_latest: "false"
          prerelease: true
          files: plugin-wzmaj/build/libs/*.jar
          body: |
            Plugin Paper 1.21.9 : met à jour le resource pack et les datapacks depuis GitHub, sans redémarrage.
            Télécharger le .jar ci-dessous et le mettre dans le dossier plugins du serveur.
